name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    uses: andregoepel/workflows/.github/workflows/ci-library.yml@main
    with:
      # The E2E suite (Aspire + Playwright) needs Docker and browser binaries, so it runs
      # in its own workflow (e2e.yml) and is excluded from the fast main pipeline here.
      test-filter: "FullyQualifiedName!~E2ETests"

  # samples/AndreGoepel.Marten.Identity.ServiceDefaults is a byte-for-byte mirror of
  # app-foundation's AndreGoepel.AppFoundation.ServiceDefaults, not a package reference (a
  # real dependency cycle otherwise - see #158). This is the guard against unnoticed drift
  # between the two copies.
  servicedefaults-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: samples/AndreGoepel.Marten.Identity.ServiceDefaults/Extensions.cs
          sparse-checkout-cone-mode: false

      - name: Compare against app-foundation's mirrored copy
        run: |
          curl -fsSL -o mirror.cs \
            https://raw.githubusercontent.com/andregoepel/app-foundation/main/src/AndreGoepel.AppFoundation.ServiceDefaults/Extensions.cs

          if ! diff -u samples/AndreGoepel.Marten.Identity.ServiceDefaults/Extensions.cs mirror.cs; then
            echo "::error::ServiceDefaults has drifted from app-foundation's mirrored copy (see marten-identity#158). Apply the same change to both files."
            exit 1
          fi

  # Runs as a local job (not inside ci-library.yml) because NuGet.org Trusted
  # Publishing validates job_workflow_ref against the workflow that defines
  # the running job - a job inside a called workflow_call workflow would
  # never match a policy scoped to this repo. See andregoepel/workflows#5.
  pack-and-publish:
    needs: ci
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write # NuGet OIDC trusted publishing
      contents: read
    steps:
      - uses: andregoepel/workflows/.github/actions/nuget-publish@main
        with:
          pack-projects: |
            src/AndreGoepel.Marten.Identity.Abstractions/AndreGoepel.Marten.Identity.Abstractions.csproj
            src/AndreGoepel.Marten.Identity/AndreGoepel.Marten.Identity.csproj
            src/AndreGoepel.Marten.Identity.Blazor/AndreGoepel.Marten.Identity.Blazor.csproj
          nuget-user: ${{ secrets.NUGET_USER }}
